name: CI

on:
  push:
    branches: [main, staging, feat/**]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  packages: read

jobs:
  # Job A: Required checks (no secrets needed)
  unit-tests:
    name: Lint, TypeCheck, Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history: the promotion-gate SHRINK GUARD below derives its
          # reference from `git merge-base HEAD <base>` and reads the gate's
          # files out of the object store at that commit. A shallow checkout has
          # no merge-base, and the guard REFUSES to pass on history it cannot
          # read (a guard that silently no-ops on a shallow clone is the
          # silent-escape it exists to prevent).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Assert pnpm overrides are readable by the installing pnpm
        # ARMED LANDMINE GUARD. pnpm <10 reads dependency overrides from
        # `package.json`; pnpm >=10 reads them from `pnpm-workspace.yaml` and
        # ignores the package.json field with only a [WARN]. So bumping any
        # INSTALL job to pnpm 11 while the overrides still live in package.json
        # drops all 39 of them — including the security floors — with no error
        # and nothing red. That is the failure mode this repo keeps getting
        # bitten by: the break reads as green.
        #
        # This script derives BOTH halves (where the overrides are, and which
        # pnpm each installing job pins) from the actual files, so it cannot go
        # stale the way a checklist would. It fails in either direction, and is
        # deliberately in the REQUIRED job so the transition blocks merge.
        run: node scripts/ci/assert-pnpm-overrides-readable.mjs
      - name: Assert every rate-limit errorResponseBuilder returns an Error
        # DERIVED GUARD (ROADMAP 2.181). @fastify/rate-limit THROWS whatever the
        # builder RETURNS (index.js:333). A builder that returns a plain object
        # gets that object thrown; this app's custom setErrorHandler receives a
        # non-Error and answers 500 INTERNAL while the limiter's own headers
        # still say 429. All nine builders shipped that way and survived months
        # of green CI — the break reads as green, again.
        #
        # Neither existing gate can catch it: the plugin types the return as
        # `object`, so a raw builder typechecks clean (proven), and lint reddens
        # on a REVERT only incidentally (unused import) and on a brand-new tenth
        # builder not at all.
        #
        # The script DERIVES its sites from the source tree — no hand-list to go
        # stale — and hard-fails if it is blinded (zero files / zero plugin
        # references / zero registrations / zero builders), so it can never pass
        # by finding nothing. Deliberately in the REQUIRED job.
        run: node scripts/ci/assert-rate-limit-builders-return-error.mjs
      - name: Generate OpenAPI types
        run: pnpm openapi:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck via build (blocking gate; emits dist)
        # Same honest gate as before — tsc over tsconfig.build.json (source-only;
        # tests are excluded) plus the explicit assertion that @talchain/schemas
        # resolves from THIS checkout at the pinned version — but the tsc pass now
        # EMITS instead of `--noEmit` (`pnpm build`; measured delta ~2-3s). Why:
        # the compiled-boot test (prompt-loader.test.ts, "compiled dist module
        # boots") is `it.skipIf(!dist exists)` and this job never built, so it
        # DETERMINISTICALLY skipped in the required gate — an always-skipping
        # check is theatre. With dist present, `pnpm test:required` below actually
        # executes it. (`pnpm check:schemas-resolution` is run explicitly because
        # it lived in `pretypecheck`, which `pnpm build` does not trigger; build
        # itself re-runs openapi:generate, which is idempotent here.)
        # The full src+test `tsc --noEmit` is deliberately NOT this gate — it
        # carries ~466 pre-existing test-file errors and lives behind the honest
        # name `pnpm typecheck:all-including-known-broken-tests`, run by the
        # separate non-required "Typecheck Drift (ratchet)" job.
        run: pnpm check:schemas-resolution && pnpm build
      - name: Validate config defaults
        run: pnpm config:validate
        env:
          # Minimal env for validation (uses defaults)
          LLM_PROVIDER: fixtures
      - name: Forbidden-boundary-pattern gate
        # Containment ratchet: blocks growth in high-risk boundary usages
        # (warnOnInvalid, `as unknown as` double-casts, science-field constant
        # fallbacks) vs an exact frozen baseline. Grep-only, no deps. Runs in
        # this job; it only blocks MERGE once `staging` branch protection
        # requires the `CI / Lint, TypeCheck, Unit Tests` status check.
        run: bash scripts/check-forbidden-boundary-patterns.sh
      - name: Prompt regression gate (orchestrator-eval)
        # REQUIRED, hermetic check. `pnpm eval:orchestrator:test`
        # (vitest run tools/orchestrator-eval) is the durable regression gate for
        # the CEE orchestrator prompt. It is deterministic and recorded-fixture
        # based: the suite installs a fetch-counter that throws on any network call
        # (with a positive-control probe) and stubs a dummy ANTHROPIC_API_KEY, so it
        # needs NO secrets and makes ZERO paid/live calls. Runs in this required job
        # so a prompt-behaviour regression blocks merge rather than being advisory.
        #
        # Placed BEFORE `test:required` on purpose: vitest.required.config.ts sets
        # no `include` and does not exclude tools/orchestrator-eval, so test:required
        # already sweeps these same *.test.ts files. If this focused step ran after
        # it, a prompt-fixture regression would redden test:required first and this
        # step would be skipped — a shadowed gate that could never independently go
        # RED. Running it first makes it the attributable signal for prompt drift.
        run: pnpm eval:orchestrator:test

      - name: Eval-pass promotion gate
        # REQUIRED, hermetic check (Harness H2). Makes an eval PASS a structural
        # precondition of promoting a prompt version: for every prompt with an
        # eval pack (DERIVED from the filesystem pack markers, never hand-listed),
        # a commit that promotes it — i.e. changes the served hash in
        # Prompts/canonical/manifest.json + the canonical export — must carry a
        # committed, in-date, HASH-MATCHED, floor-PASSING promotion report, or the
        # merge is blocked. Prompts with no pack promote as today but are marked
        # UNGATED (visible, not silent). Pre-gate promotions with no passing eval
        # are grandfathered at their exact hash by promotion-gate-baseline.json (a
        # shrink-only ratchet); a bump voids the grandfather and re-requires a
        # passing eval. Reads only committed git state — ZERO network / LLM calls.
        #
        # ⚠ This gates the GIT source-of-truth. A live-only staging promotion via
        # the admin API that never regenerates+commits the manifest is not visible
        # here — closing that hole is the runtime seam in src/routes/admin.prompts.ts
        # (sequenced separately). See tools/orchestrator-eval/src/promotion-gate.
        run: pnpm eval:promotion-gate

      - name: Promotion-gate shrink guard
        # REQUIRED (Harness H2, review amendment A3). The gate above answers
        # "may this promotion land?". It structurally cannot answer "is the gate
        # still gating what it gated yesterday?" — and BOTH ways of switching it
        # off were silent, proven against the unamended gate:
        #   · delete a task's promotion-pack.ts marker (or its manifest row) and
        #     a GATED-PASS becomes UNGATED / disappears, exit 0;
        #   · hand-add a promotion-gate-baseline.json entry and a real BLOCK
        #     (exit 1) becomes a tolerated GRANDFATHERED row, exit 0.
        # This step derives both sets from GIT at the merge-base (never a
        # hand-pinned list, trap 12) and FAILS unless the shrink/widen is
        # recorded in promotion-gate-acknowledgments.json in the SAME diff.
        # Needs the full history fetched above.
        run: pnpm eval:promotion-gate:shrink-guard

      - name: Run required test subset
        # Deterministic, in-process suite (see vitest.required.config.ts).
        # Since O-6 this INCLUDES the ~155 in-process tests/integration files —
        # only the finite, self-checking REQUIRED_GATE_INTEGRATION_EXCLUSIONS
        # list (vitest.shared.ts: real Supabase/Postgres, live LLM, staging
        # HTTP) is excluded, so a change that breaks an in-process integration
        # test turns THIS required check red (the old `tests/integration/**`
        # category glob let PR #539 report "0 failed" while breaking two).
        # The full suite + coverage and the external-dependent files still run
        # in the non-required "Full Test Suite (advisory)" / "Integration
        # Tests (advisory)" jobs below, so nothing is hidden.
        run: pnpm test:required

      - name: Check for quarantined tests
        if: success()
        run: |
          # An "active" QUARANTINED test is one tagged with the QUARANTINED label
          # but neither inside a comment line nor inside a `.skip(...)` literal.
          # Legitimate quarantine pattern: `describe.skip("Foo - QUARANTINED", ...)`
          # plus a `// TODO: TEST-N` annotation on the line above — those are
          # already authorised by the Test Skip Guard workflow.
          #
          # The previous form (`grep -l "QUARANTINED"`) returned filenames, which
          # failed-positive on legitimate `describe.skip(... QUARANTINED ...)`
          # cases as soon as typecheck went green (this step runs `if: success()`).
          # This refined form keeps the intent (no test should be tagged
          # QUARANTINED while still actively running) without the false positives.
          MATCHES=$(grep -rn "QUARANTINED" --include="*.test.ts" --include="*.spec.ts" src/ tests/ 2>/dev/null || true)
          if [ -z "$MATCHES" ]; then
            echo "✅ No QUARANTINED markers found"
            exit 0
          fi
          # Drop comment lines (content starts with `//`) and lines containing `.skip(`.
          ACTIVE=$(echo "$MATCHES" | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*//' | grep -v '\.skip(' || true)
          if [ -n "$ACTIVE" ]; then
            COUNT=$(echo "$ACTIVE" | wc -l | tr -d ' ')
            echo "::error::$COUNT active QUARANTINED test marker(s) detected — .skip them, fix them, or remove the QUARANTINED label before merging:"
            echo "$ACTIVE"
            exit 1
          fi
          echo "✅ All QUARANTINED markers are inside comments or .skip(...) literals"

  # Full Test Suite (advisory): the complete `pnpm test -- --coverage` + Codecov
  # upload, relocated verbatim from the required job. NON-REQUIRED — surfaces the
  # full suite (all test files green since #493) and coverage without blocking
  # merges. Coverage thresholds are a regression RATCHET at the measured
  # baseline (see vitest.config.ts), so a red here means a REAL regression —
  # new test failures or a coverage drop — not a stale aspiration.
  full-test-suite:
    name: Full Test Suite (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Generate OpenAPI types
        run: pnpm openapi:generate
      - name: Run full test suite with coverage
        run: pnpm test -- --coverage
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        # NON-BLOCKING: tokenless v3 uploads are rate-limited by codecov.io
        # (observed: exit 255, "429 Rate limit reached. Please upload with the
        # Codecov repository upload token", run 29550676845) and no
        # CODECOV_TOKEN secret exists in this repo, so this step fails on most
        # runs regardless of test/coverage health. continue-on-error keeps the
        # upload attempt (it sometimes lands) and keeps the failure VISIBLE as
        # a step annotation, without letting upload flake redden the suite
        # signal. To make it reliable: add a CODECOV_TOKEN secret and pass
        # `token:` (and upgrade the action) — then remove this escape hatch.
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true

  # Integration Tests (advisory): the focused service-like suite
  # (tests/integration). NON-REQUIRED — reports the integration failures
  # separately from the in-process required gate.
  integration-tests:
    name: Integration Tests (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Generate OpenAPI types
        run: pnpm openapi:generate
      - name: Run integration tests
        run: pnpm test:integration

  # Typecheck Drift (ratchet): full `tsc --noEmit` (tsconfig.json = src + tests).
  # NON-REQUIRED job — not in any branch-protection required-checks list, so it
  # never blocks merges. It tolerates a committed baseline of pre-existing
  # test-file type errors (scripts/ci/typecheck-baseline.txt) and FAILS only on
  # NEW drift (a new erroring file, or the total count rising past baseline),
  # keeping the full typecheck visible without forcing a bulk cleanup.
  typecheck-drift:
    name: Typecheck Drift (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Generate OpenAPI types
        run: pnpm openapi:generate
      - name: Typecheck drift ratchet (full tsc; baseline-tolerant)
        run: bash scripts/ci/typecheck-ratchet.sh

  # Job B: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11+ REQUIRED here (other jobs stay on 9): npmjs.org retired the
          # legacy quick-audit endpoint (/-/npm/v1/security/audits{,/quick}) and
          # now returns 410. pnpm <=10.x still calls it, so `pnpm audit` below
          # errored on EVERY run (ERR_PNPM_AUDIT_BAD_RESPONSE 410). Since v11
          # pnpm audit uses the bulk advisory endpoint
          # (/-/npm/v1/security/advisories/bulk). Do NOT downgrade to 9 — that
          # re-breaks this alarm. See pnpm/pnpm#11265, pnpm/pnpm#11268.
          version: 11
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >=22.13 (it uses the node:sqlite builtin); on
          # Node 20 the pnpm binary itself crashes. Only this audit job moves to
          # 22 — the other jobs stay on Node 20.
          node-version: 22
      # NOTE: deliberately NO `pnpm install` here, and that is load-bearing, not
      # just an optimisation. `pnpm audit` reads pnpm-lock.yaml directly (it does
      # not need node_modules), so the install is unnecessary — and skipping it is
      # what keeps this job's pnpm 11 compatible with overrides that still live in
      # package.json. Both halves are MEASURED, not predicted (2026-07-27, this
      # lockfile, pnpm 9.15.9 / pnpm 11.13.1):
      #   - pnpm 11 + overrides in package.json  -> audit fine, but any
      #     `--frozen-lockfile` install would drop all 39 overrides (pnpm 11 only
      #     logs `[WARN] The "pnpm" field in package.json is no longer read`).
      #   - overrides moved to pnpm-workspace.yaml -> pnpm 11 installs cleanly with
      #     a byte-identical lockfile, but EVERY pnpm-9 install job then fails with
      #     ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (pnpm <10 cannot read that key).
      # So the move is safe ONLY as part of moving the installing jobs to pnpm >=10
      # (18 of them, all currently pinned to 9) — it cannot land on its own. Until
      # then the `Assert pnpm overrides are readable by the installing pnpm` step in
      # the unit-tests job blocks the half-migration in either direction.
      # Auditing from the committed lockfile needs no NPM_PACKAGES_TOKEN.
      - name: Check for duplicate files (prevents drift from shadow copies)
        run: |
          # Fail if any duplicate-pattern files exist in tracked files
          # Only match delimited patterns to avoid false positives (e.g., "deepcopy.ts" is legitimate)
          PATTERNS=('* 2.ts' '* 2.js' '* copy.ts' '* copy.js' '*_copy.ts' '*_copy.js' '*-copy.ts' '*-copy.js')
          FOUND_FILES=""
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git ls-files "$pattern" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              FOUND_FILES="$FOUND_FILES$MATCHES"$'\n'
            fi
          done
          if [ -n "$FOUND_FILES" ]; then
            echo "ERROR: Duplicate files detected (shadow copies create drift risk):"
            echo "$FOUND_FILES"
            exit 1
          fi
      - name: Run security audit
        # This is the always-on, blocking dependency-vuln alarm. It is NOT made
        # redundant by security-scanning.yml: Snyk there is gated on SNYK_TOKEN
        # (skipped when unset) and Dependency Review is continue-on-error + PR-only
        # + needs the Dependency Graph enabled. This step runs on push and PR with
        # no token, so keep it working rather than removing it.
        run: pnpm audit --audit-level=high

      # Derive, don't mirror. `pnpm-workspace.yaml` suppresses exactly one GHSA
      # (GHSA-mh99-v99m-4gvg, brace-expansion OOM DoS) because the fix exists
      # only on the 5.x line and minimatch@3/@5/@9 cannot leave 1.x/2.x without
      # an API break -- the full reasoning lives next to the entry itself.
      # That justification is a hand-maintained claim, and hand-maintained
      # claims drift silently -- which is exactly how this job's "it's just a
      # brace-expansion advisory" label came to hide a HIGH against the
      # deployed HTTP router. So assert the premise still holds: if the
      # unfixable 1.1.16 / 2.1.2 resolutions ever leave the lockfile, the
      # suppression has outlived its reason and MUST be deleted rather than
      # left to mute something new.
      - name: Assert audit suppression is still necessary
        run: |
          missing=""
          for v in 1.1.16 2.1.2; do
            grep -qE "^  brace-expansion@${v}:" pnpm-lock.yaml || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::brace-expansion$missing no longer resolved in pnpm-lock.yaml."
            echo "The GHSA-mh99-v99m-4gvg entry in pnpm-workspace.yaml exists ONLY because"
            echo "minimatch@3/@5/@9 pin brace-expansion 1.x/2.x, for which no patch exists."
            echo "That premise no longer holds. DELETE the auditConfig.ignoreGhsas entry"
            echo "and this step, then re-run the audit unsuppressed."
            exit 1
          fi
          echo "OK: brace-expansion 1.1.16 and 2.1.2 still resolved; suppression still justified."

  # Job C: Spec v04 compliance (already exists as separate workflow, keeping here for visibility)
  # See .github/workflows/spec-v04-audit.yml

  # Job D: Live LLM tests (optional, requires secrets)
  # Note: GitHub Actions cannot check secret existence in job-level 'if' conditions.
  # This job will run but skip the test step if the secret is not set.
  live-tests:
    name: Live LLM Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests  # Run after unit tests pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Run live LLM tests
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_LLM: '1'
        run: pnpm test:live
      - name: Skip live tests (no API key)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "⏭️ Skipping live LLM tests - ANTHROPIC_API_KEY not configured"
