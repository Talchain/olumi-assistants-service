name: Telemetry Event Name Validation

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, staging]

# ⛔ SUPERSEDED RUNS MUST NOT HOLD RUNNERS.
#
# Measured 23 Sep 2026, 00:26 UTC: 63 workflow runs queued against 1 in
# progress, with 25 open PRs. Nothing could go green, so nothing could merge,
# so nothing could deploy — the queue, not any individual change, was the
# binding constraint on shipping. Without a concurrency group every push
# enqueues a fresh full set and the runs it superseded keep their place.
#
# ⚠ `cancel-in-progress` is FALSE on staging and main, deliberately. A run on a
# protected branch is the deploy gate and part of the record; cancelling one
# would destroy evidence of what was verified at that SHA. Only branch and PR
# runs — where a newer push has already made the older run irrelevant — cancel.
concurrency:
  # ⛔ NORMALISED REF, so a same-repo PR and its branch push share ONE group.
  #
  # Measured on PR #1711, one head SHA: `Lint, TypeCheck, Unit Tests` ran TWICE.
  # These workflows trigger on both `push` and `pull_request`, and for a branch
  # in this repo those produce different `github.ref` — `refs/heads/<branch>`
  # versus `refs/pull/<n>/merge`. Different ref, different group, both survive.
  # With 25 open PRs that doubling is plausibly the larger half of the queue.
  #
  # ⚠ The obvious remedy, `github.head_ref || github.ref`, does NOT work: on a
  # PR `head_ref` is "fix/foo" while on a push `github.ref` is
  # "refs/heads/fix/foo" — still two groups. `github.ref_name` strips the
  # refs/heads/ prefix, so pairing it with `pull_request.head.ref` yields the
  # same string from both events.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  validate-event-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Validate telemetry event names
        run: |
          echo "Validating that all emit() calls use frozen event names from TelemetryEvents enum..."

          # Extract all event names from emit() calls in source code (excluding test files)
          # Pattern: emit("event.name", ...) or emit('event.name', ...)
          EMIT_CALLS=$(grep -rn "emit(" src/ --include="*.ts" --include="*.js" | grep -oP "emit\(['\"]([^'\"]+)['\"]" | sed -E "s/emit\(['\"]([^'\"]+)['\"]/ \1 /" || true)

          if [ -z "$EMIT_CALLS" ]; then
            echo "⚠️  Warning: No emit() calls found in source code"
            exit 0
          fi

          # Get valid event names from TelemetryEvents enum
          VALID_EVENTS=$(node -e "
            import('./dist/src/utils/telemetry.js').then(m => {
              const validNames = Array.from(m.VALID_EVENT_NAMES);
              console.log(validNames.join('\n'));
            });
          ")

          UNKNOWN_EVENTS=""
          while IFS= read -r event; do
            event=$(echo "$event" | xargs) # Trim whitespace
            if [ -n "$event" ]; then
              if ! echo "$VALID_EVENTS" | grep -Fxq "$event"; then
                UNKNOWN_EVENTS="$UNKNOWN_EVENTS\n  - $event"
              fi
            fi
          done <<< "$EMIT_CALLS"

          if [ -n "$UNKNOWN_EVENTS" ]; then
            echo "❌ FAILED: Unknown telemetry event names detected:"
            echo -e "$UNKNOWN_EVENTS"
            echo ""
            echo "All emit() calls must use event names from the frozen TelemetryEvents enum."
            echo "Valid event names are:"
            echo "$VALID_EVENTS" | sed 's/^/  - /'
            echo ""
            echo "To fix:"
            echo "1. Use TelemetryEvents.EventName instead of hardcoded strings"
            echo "2. If adding a new event, update src/utils/telemetry.ts:"
            echo "   - Add to TelemetryEvents enum"
            echo "   - Update dashboard queries"
            echo "   - Update alert configurations"
            echo "   - Document in observability/README.md"
            exit 1
          fi

          echo "✅ All emit() calls use valid frozen event names"

      - name: Check for event name drift in tests
        run: |
          echo "Checking test files for hardcoded event strings..."

          # Allow test files to use event strings, but warn if they don't match
          TEST_EMIT_CALLS=$(grep -rn "emit(" tests/ --include="*.ts" | grep -oP "emit\(['\"]([^'\"]+)['\"]" | sed -E "s/emit\(['\"]([^'\"]+)['\"]/ \1 /" || true)

          if [ -n "$TEST_EMIT_CALLS" ]; then
            echo "⚠️  Warning: Test files contain emit() calls. Ensure they use TelemetryEvents enum for consistency."
          else
            echo "✅ No hardcoded emit() calls in tests"
          fi
