name: Isolated native context trial
on:
  push:
    branches: [experiment/openai-native-context-20261002]
    paths:
      - src/orchestrator-v5/agent-lane/runtime/native-context-trial.ts
      - src/orchestrator-v5/agent-lane/__tests__/native-context-trial.integration.test.ts
      - scripts/apply-native-context-trial.mjs
      - tests/native-context-trial/**
      - .github/workflows/native-context-trial.yml
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: isolated-native-context-trial
  cancel-in-progress: false
jobs:
  focused:
    if: github.ref == 'refs/heads/experiment/openai-native-context-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/openai-native-context-20261002
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Apply exact-base integration and commit only to experiment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-native-context-trial.mjs
          git diff --check
          if ! git diff --quiet -- src/routes/agent-v1-turn.ts src/orchestrator-v5/agent-lane/runtime/agent-loop.ts; then
            git config user.name 'Olumi isolated trial'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/routes/agent-v1-turn.ts src/orchestrator-v5/agent-lane/runtime/agent-loop.ts
            git commit -m 'feat(experiment): wire native context into real Agent route and loop'
            git push origin HEAD:refs/heads/experiment/openai-native-context-20261002
          fi
          mkdir -p native-context-evidence
          git rev-parse HEAD | tee native-context-evidence/tested-sha.txt
          git show --stat HEAD > native-context-evidence/source-summary.txt
      - name: Focused transport and lifecycle tests
        run: node --experimental-strip-types --test tests/native-context-trial/continuation.test.mjs 2>&1 | tee native-context-evidence/helper-tests.txt
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Build real backend
        id: build
        continue-on-error: true
        run: pnpm build 2>&1 | tee native-context-evidence/build.txt
      - name: Lint changed runtime files
        id: lint
        continue-on-error: true
        run: pnpm exec eslint src/routes/agent-v1-turn.ts src/orchestrator-v5/agent-lane/runtime/agent-loop.ts src/orchestrator-v5/agent-lane/runtime/native-context-trial.ts 2>&1 | tee native-context-evidence/lint.txt
      - name: Real-route trial and existing compatibility tests
        id: tests
        continue-on-error: true
        run: |
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism \
            src/orchestrator-v5/agent-lane/__tests__/native-context-trial.integration.test.ts \
            src/orchestrator-v5/agent-lane/__tests__/turn-state-given-not-fetched.test.ts \
            src/orchestrator-v5/agent-lane/__tests__/provider-ledger-prompt-identity.test.ts \
            2>&1 | tee native-context-evidence/route-tests.txt
      - name: Focused verdict
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          printf 'build=%s\nlint=%s\nroute_tests=%s\n' "$BUILD" "$LINT" "$TESTS" | tee native-context-evidence/verdict.txt
          test "$BUILD" = success && test "$LINT" = success && test "$TESTS" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-context-evidence
          path: native-context-evidence/
          retention-days: 7
