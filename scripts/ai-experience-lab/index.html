<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olumi · AI experience lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202b29;background:#f5f6f2}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:28px}header{border-bottom:1px solid #d7dfd9;padding-bottom:18px}h1{font-size:26px;margin:8px 0}p{line-height:1.5}.tag{font-size:12px;letter-spacing:.1em;color:#436a59}.note{color:#54615b;font-size:14px}button,select,textarea{font:inherit;border:1px solid #bccbc1;border-radius:8px;padding:10px;background:white}button{cursor:pointer;background:#285d4c;color:white}button:disabled{opacity:.5;cursor:wait}select{min-width:270px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}article{white-space:pre-wrap;line-height:1.55;border-radius:10px;padding:16px 20px;margin:14px 0;background:white;border:1px solid #e0e5df}article.user{background:#e5eee6}article .label{display:block;font-size:12px;font-weight:650;margin-bottom:8px;color:#506d5d}.metrics{font-size:12px;color:#50645a;margin-top:12px;white-space:normal}textarea{width:100%;min-height:100px;resize:vertical}form button,.fresh button{margin-top:10px}.fresh{margin:20px 0}.fresh label{display:block;margin-bottom:8px}details{background:#edf1eb;border-radius:8px;padding:12px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.error{color:#993d35}#chat:empty::after{content:"Choose a prompt below, or write your own question about this model.";display:block;padding:25px 0;color:#66766a}.quick button{background:white;color:#285d4c;font-size:13px}.quick{display:flex;flex-wrap:wrap;gap:7px}.head{font-family:monospace;font-size:12px}summary{cursor:pointer}
</style>
<header><div class="tag">OLUMI / DISPOSABLE LAB</div><h1>Explore reasoning examples</h1><p id="intro" class="note">Compare AI on the frozen pricing model. The recorded science examples are separate.</p><div id="identity" class="head">Connecting…</div></header>
<div class="toolbar"><button id="rehearsal-toggle" type="button">Open recorded reasoning walkthrough</button><button id="regions-toggle" type="button">Open frozen R3-B science cases</button></div>
<section id="rehearsal" hidden aria-live="polite"></section>
<section id="regions" hidden aria-live="polite"></section>
<section id="live">
<div id="fresh-entry" class="fresh" hidden><label for="fresh-brief">Start from your own brief</label><textarea id="fresh-brief" maxlength="12000" placeholder="Describe the situation, what matters, and what is uncertain…"></textarea><button id="start-fresh" type="button">Start fresh model</button></div>
<div class="toolbar"><label for="arm">Comparison</label><select id="arm"><option value="A">A · Terra + coaching</option><option value="baseline">Baseline · Terra</option><option value="B">B · Luna</option><option value="C">C · Luna + coaching</option></select><button id="reset">Reset to identical starting state</button></div>
<details><summary>Starting brief and model context</summary><p id="brief"></p><details><summary>Earlier conversation</summary><pre id="history"></pre></details><details><summary>Model snapshot</summary><pre id="graph"></pre></details></details>
<div class="toolbar"><button id="widen" type="button" hidden>Explore fresh AI hypotheses for this model</button><span id="widen-note" class="note"></span></div>
<div class="quick"><button type="button">What assumption are we most at risk of getting wrong? Do not change the model.</button><button type="button">What are we missing? Suggest one genuinely different approach. Do not change the model.</button><button type="button">We don't know how customers will react. What is the most useful thing to investigate next?</button></div>
<div id="chat" aria-live="polite"></div>
<form id="form"><label for="message">Your message</label><textarea id="message" required placeholder="Ask a question, challenge an assumption, or request a change…"></textarea><button id="send">Send</button><span id="progress" class="note"></span></form>
</section>
<p id="error" class="error" role="alert"></p>
<script type="module">
import { mountRehearsal, mountFrozenRegions } from "/lab/rehearsal-ui.mjs";
const $=id=>document.getElementById(id);let session=null,busy=false,m2Available=false;
const identityValue=value=>typeof value==='string'?value:value?.value;
async function call(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok){const error=new Error(x.error||x.withheld_reason||JSON.stringify(x));error.payload=x;throw error}return x}
const freshId=()=>/^#lab-scenario=([0-9a-f-]{36})$/i.exec(location.hash)?.[1]||null;
function rememberFresh(sid){history.replaceState(null,'','#lab-scenario='+sid)}
function forgetFresh(){if(location.hash.startsWith('#lab-scenario='))history.replaceState(null,'',location.pathname+location.search)}
function freshBound(){return session?.mode==='fresh'&&typeof session.scenario_id==='string'&&!!session.scenario_id&&session.version_binding==='bound'&&/^[a-f0-9]{64}$/.test(identityValue(session.graph_identity_hash)||'')&&typeof session.model_version_id==='string'&&!!session.model_version_id}
function refreshWiden(){const fresh=session?.mode==='fresh';$('widen').hidden=!m2Available||(fresh&&!freshBound());$('widen-note').textContent=fresh&&!freshBound()?(session.withheld_reason||'The current model version could not be verified; AI hypotheses are withheld.'):''}
function showSession(next,mode){if(typeof next.session_id!=='string'||!next.session_id||mode==='fresh'&&!next.scenario_id)throw new Error('Lab session was not returned.');session={...next,mode};$('brief').textContent=next.brief_text||next.brief||'';const history=Array.isArray(next.history)?next.history:[];$('history').textContent=history.map(h=>'You: '+(h.user||'')+'\nOlumi: '+(h.assistant||'')).join('\n\n');$('graph').textContent=JSON.stringify(next.graph??null,null,2);$('chat').replaceChildren();$('message').value='';if(mode==='fresh'&&(next.turn?.assistant_message||next.turn?.suggested_actions?.length)){const a=add('assistant',next.turn.assistant_message||'The saved model is ready to explore.');renderApprovalActions(next.turn.suggested_actions,a)}refreshWiden()}
function lock(value){busy=value;for(const id of ['send','reset','arm','widen','start-fresh','fresh-brief'])$(id).disabled=value;for(const button of $('chat').querySelectorAll('[data-agent-approval] button'))button.disabled=value||!!button.closest('[data-stale]');$('progress').textContent=value?' Thinking…':''}
async function reset(){if(busy)return;lock(true);$('error').textContent='';try{showSession(await call('/lab/session',{arm:$('arm').value}),'frozen');forgetFresh()}catch(e){$('error').textContent=e.message}finally{lock(false)}}
async function startFresh(){if(busy)return;const brief=$('fresh-brief').value.trim();if(!brief){$('error').textContent='Enter a brief to start a fresh model.';return}lock(true);$('error').textContent='';try{const next=await call('/lab/session',{mode:'fresh',brief});showSession(next,'fresh');rememberFresh(next.scenario_id)}catch(e){$('error').textContent=e.message}finally{lock(false)}}
async function openSavedFresh(){const sid=freshId();if(!sid)return reset();try{const next=await call('/lab/session/'+encodeURIComponent(sid));if(next.session_id!==sid||next.scenario_id!==sid)throw new Error('The model readback did not match the saved session.');showSession(next,'fresh')}catch(e){await reset();$('error').textContent='The saved Lab model could not be reopened: '+e.message}}
function add(kind,text,host=$('chat')){const node=document.createElement('article');node.className=kind;const label=document.createElement('span');label.className='label';label.textContent=kind==='user'?'YOU':'OLUMI · LAB';node.append(label,document.createTextNode(text));host.append(node);return node}
function clearApprovalActions(){for(const old of $('chat').querySelectorAll('[data-agent-approval]:not([data-stale])')){old.dataset.stale='true';old.querySelectorAll('button').forEach(b=>b.disabled=true);const note=document.createElement('span');note.className='note';note.textContent='Earlier approval no longer available.';old.append(note)}}
function renderApprovalActions(actions,host){clearApprovalActions();const approvals=(Array.isArray(actions)?actions:[]).filter(a=>typeof a?.id==='string'&&a.id.startsWith('agent-approve-proposal:')&&typeof a.label==='string'&&a.label.trim());if(!approvals.length)return;const controls=document.createElement('div');controls.className='toolbar';controls.dataset.agentApproval='true';host.append(controls);for(const action of approvals){const item=document.createElement('div');const button=document.createElement('button');button.type='button';button.textContent=action.label;button.onclick=()=>sendApprovalChip(action.id,action.label);item.append(button);if(typeof action.detail==='string'&&action.detail.trim()){const detail=document.createElement('div');detail.className='note';detail.textContent=action.detail;item.append(detail)}controls.append(item)}}
function appendAgentReply(r,changed){const response=r.response||{};const a=add('assistant',response.assistant_text||'No assistant text returned.');const calls=response._provider_calls||[];const tools=response._agent?.tool_calls||[];const stats=document.createElement('div');stats.className='metrics';stats.textContent=(Number.isFinite(r.latency_ms)?(r.latency_ms/1000).toFixed(1)+'s · ':'')+calls.map(c=>c.model).join(', ')+' · '+calls.length+' model call(s) · local model '+(changed?'changed':'unchanged');a.append(stats);const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent='Tool and response receipt';p.textContent=JSON.stringify({tools,provider_calls:calls,pending_actions:response.pending_actions,graph_changed:changed},null,2);d.append(s,p);a.append(d);renderApprovalActions(response.suggested_actions,a)}
function staleM2Cards(){for(const card of $('chat').querySelectorAll('[data-m2-card]:not([data-stale])')){card.dataset.stale='true';card.querySelectorAll('button').forEach(button=>{if(button.textContent!=='Dismiss')button.disabled=true});const note=document.createElement('div');note.className='note';note.textContent='Computed on an earlier model — explore fresh hypotheses again.';card.append(note)}}
function withholdFresh(reason){staleM2Cards();session={...session,version_binding:'unverified',withheld_reason:reason||'The current model could not be verified; AI hypotheses are withheld.'};refreshWiden()}
function applyFreshReadback(next){if(!next||next.session_id!==session.session_id||next.scenario_id!==session.scenario_id){withholdFresh('The current model readback did not match this session; AI hypotheses are withheld.');throw new Error(session.withheld_reason)}const changed=identityValue(next.graph_identity_hash)!==identityValue(session.graph_identity_hash)||next.model_version_id!==session.model_version_id||next.graph_hash!==session.graph_hash;if(changed)staleM2Cards();session={...session,...next,mode:'fresh'};$('brief').textContent=next.brief_text||'';$('graph').textContent=JSON.stringify(next.graph??null,null,2);refreshWiden();return changed}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy||!session)return;const text=$('message').value.trim();if(!text)return;lock(true);$('error').textContent='';add('user',text);$('message').value='';try{const r=await call('/lab/turn',{session_id:session.session_id,message:text});let changed=!!r.graph_changed;if(session.mode==='fresh'){changed=applyFreshReadback(r.readback||await call('/lab/session/'+encodeURIComponent(session.session_id)))||changed;if(changed)staleM2Cards()}else if(changed){staleM2Cards();const state=await call('/lab/session/'+encodeURIComponent(session.session_id));$('graph').textContent=JSON.stringify(state.graph,null,2)}appendAgentReply(r,changed)}catch(e){if(session?.mode==='fresh'){clearApprovalActions();withholdFresh(e.payload?.withheld_reason||e.message)}$('error').textContent=e.message}finally{lock(false)}});
async function sendApprovalChip(id,label){if(busy||session?.mode!=='fresh')return;lock(true);$('error').textContent='';try{const r=await call('/lab/turn',{session_id:session.session_id,chip:{id}});add('user',label);const changed=applyFreshReadback(r.readback||await call('/lab/session/'+encodeURIComponent(session.session_id)));appendAgentReply(r,changed)}catch(e){clearApprovalActions();try{applyFreshReadback(e.payload?.readback||await call('/lab/session/'+encodeURIComponent(session.session_id)))}catch{withholdFresh(e.message)}$('error').textContent=e.message}finally{lock(false)}}
$('widen').onclick=async()=>{if(busy||!session||session.mode==='fresh'&&!freshBound())return;lock(true);$('error').textContent='';$('widen-note').textContent='Reading this provisional model; no changes will be made.';
try{const r=await call('/lab/widen',{session_id:session.session_id});
if(session.mode==='fresh'&&(!freshBound()||r.version_binding!=='bound'||identityValue(r.graph_identity_hash)!==identityValue(session.graph_identity_hash)||r.model_version_id!==session.model_version_id||r.scenario_id&&r.scenario_id!==session.scenario_id)){withholdFresh('These hypotheses were computed on an earlier model; current model readback is needed.');throw new Error(session.withheld_reason)}
if(!r.accepted){add('assistant','The AI widening answer did not pass the proposal checks, so no suggestions are shown.');return}
if(!r.proposals.length){add('assistant','The read-only widening pass found no additional proposal worth showing. Zero is a valid result.');return}
const intro=add('assistant','READ-ONLY AI HYPOTHESES · Provisional ideas to inspect, not facts or analysis results. Nothing has been added to the model.');
const stats=document.createElement('div');stats.className='metrics';stats.textContent=[r.model,Number.isFinite(r.latency_ms)?(r.latency_ms/1000).toFixed(1)+'s':null,'full model '+String(session.mode==='fresh'?identityValue(r.graph_identity_hash):r.graph_hash||'').slice(0,12)].filter(Boolean).join(' · ');intro.append(stats);
for(const p of r.proposals){const a=add('assistant',p.candidate+'\n'+p.why_it_may_matter);a.dataset.m2Card='true';const controls=document.createElement('div');controls.className='toolbar';a.append(controls);
const explore=document.createElement('button');explore.type='button';explore.textContent='Explore';explore.onclick=()=>{explore.disabled=true;const d=document.createElement('div');d.className='note';d.textContent='How to investigate: '+p.how_to_test_or_explore+'\nPointers: '+p.evidence_pointers.map(x=>x.kind+': '+(x.quote||x.ref_id||x.code||x.missing_concept)).join(' · ');a.append(d)};controls.append(explore);
const addNote=document.createElement('button');addNote.type='button';addNote.textContent='Add to investigation notes';addNote.onclick=()=>{addNote.disabled=true;addNote.textContent='Added locally';const d=document.createElement('div');d.className='note';d.textContent='Investigation note only. No model value changed.';a.append(d)};controls.append(addNote);
const dismiss=document.createElement('button');dismiss.type='button';dismiss.textContent='Dismiss';dismiss.onclick=()=>a.remove();controls.append(dismiss)}
}catch(e){if(session?.mode==='fresh'){if(e.payload?.readback){try{applyFreshReadback(e.payload.readback)}catch{}}else if(e.payload?.withheld_reason)withholdFresh(e.payload.withheld_reason)}$('error').textContent=e.payload?.withheld_reason||e.message}finally{refreshWiden();lock(false)}};
$('reset').onclick=reset;$('arm').onchange=reset;$('start-fresh').onclick=startFresh;document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('message').value=b.textContent;$('message').focus()});
call('/lab/status').then(s=>{$('identity').textContent='Branch build '+s.head.slice(0,12)+' · local preview';$('fresh-entry').hidden=s.fresh_available!==true;if(s.fresh_available===true)$('intro').textContent='Compare AI on the frozen pricing model or start from your own brief. The recorded science examples are separate. A fresh model needs a verified current version before AI hypotheses can be shown.';m2Available=!!s.m2_available;return s.fresh_available===true?openSavedFresh():reset()}).catch(e=>{$('error').textContent=e.message});
mountRehearsal({add,call});
mountFrozenRegions({add,call});
</script></html>
