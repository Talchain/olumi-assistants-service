name: Contract schemas
on: [push, pull_request]
jobs:
  check-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Guard — registry @talchain/schemas requires package-read token
        # Sentinel: passes as a no-op while @talchain/schemas is vendored (file:);
        # fails loudly only if it switches to a registry spec while
        # NPM_PACKAGES_TOKEN is missing. See Docs/v5/v5-schemas-ci-auth-readiness.md.
        run: bash scripts/ci/guard-schemas-registry-token.sh
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - run: npx tsx scripts/export-schemas.ts
      - name: Verify committed schemas match generated output
        run: git diff --exit-code contracts/
