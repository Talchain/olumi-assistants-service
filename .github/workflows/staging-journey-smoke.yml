name: Staging Journey Smoke

# THE ALARM.
#
# Drafting — step one of the product — was broken on staging for hours while
# seven merges shipped over it. Nothing caught it. The pre-existing
# `nightly-smoke` workflow was `skipped` on 8 of its last 8 runs (gated behind
# the repo variable SMOKE_SCHEDULE_ENABLED, which has never been set), marked
# `continue-on-error`, scheduled weekly, and pointed at PRODUCTION — an
# environment that is out of scope. `cee-diagnostics` is dead the same way.
#
# This workflow is deliberately built WITHOUT every mechanism that made those
# two silent:
#   - NO `continue-on-error`      → a red step fails the run.
#   - NO `if: vars.X == 'true'`   → cannot be switched off by leaving a
#                                    variable unset. There is no off switch.
#   - NO schedule                 → runs on the push that deploys, every time.
#   - NOT production              → targets staging; the script itself refuses
#                                    to run against the production hostname.
#
# These properties are ASSERTED BY A TEST that parses THIS FILE
# (tests/unit/ci/staging-journey-smoke.test.ts). The test derives the facts
# from the YAML rather than keeping a second hand-maintained copy of them, so
# re-introducing `continue-on-error` or a `vars.` gate turns the test suite red.
# Deleting this file also turns it red. Disabling this alarm is possible — but
# it cannot be done SILENTLY.
#
# HOW IT CATCHES THE OUTAGE
#   Render auto-deploys `staging` on push. This workflow starts on that same
#   push and first POLLS /healthz until the deployed build matches this commit.
#   If the deploy failed (CEE 26638e7a was `build_failed` when this was
#   written), the poll times out and the run goes RED — so "the deploy did not
#   ship" is caught even though Render never tells GitHub anything. Only once
#   the right build is confirmed serving does it drive the real user journey.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      expect_sha:
        description: "Commit expected to be serving (blank = test whatever is deployed)"
        required: false
        type: string

permissions:
  contents: read

# Only the newest push matters; an older in-flight run is testing a build that
# is already superseded.
concurrency:
  group: staging-journey-smoke
  cancel-in-progress: true

jobs:
  journey:
    name: Live user journey against deployed staging
    runs-on: ubuntu-latest
    # Freshness poll (15 min) + two turns (~1 min) + headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `pnpm install` on purpose: the gate is a dependency-free .mjs using
      # built-in fetch. That keeps the alarm fast, and keeps it working even
      # when the dependency graph is what broke.
      - name: Drive the live user journey
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_ASSIST_BASE_URL || 'https://cee-staging.onrender.com' }}
          # OWNER ACTION REQUIRED: this repository secret does not exist yet.
          # `cee-diagnostics.yml` already expects the same name. It must hold
          # the staging value of ASSIST_API_KEY (see .env.staging.local).
          # If it is missing the script exits 2 and the run goes RED — a
          # missing secret must never read as a pass.
          SMOKE_API_KEY: ${{ secrets.STAGING_ASSIST_API_KEY }}
          SMOKE_EXPECT_SHA: ${{ github.event.inputs.expect_sha || github.sha }}
        # `shell: bash` is LOAD-BEARING, not cosmetic. GitHub's default Linux
        # shell is `bash -e {0}` WITHOUT pipefail, so `node ... | tee` would
        # exit with tee's status (0) and this alarm would pass while the
        # journey was broken — the exact guarantee-theatre this gate exists to
        # end. `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`.
        # Asserted by tests/unit/ci/staging-journey-smoke.test.ts.
        shell: bash
        run: node scripts/ci/staging-journey-smoke.mjs 2>&1 | tee staging-journey-smoke.log

      - name: Upload journey log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-journey-smoke-log
          path: staging-journey-smoke.log
