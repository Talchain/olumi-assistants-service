services:
  - type: web
    name: olumi-assistants-staging
    runtime: node
    plan: starter
    region: oregon
    branch: staging
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Staging serves the PMS `staging_version` pointer — this is where a
      # promoted prompt is proven before it reaches production. Declared
      # explicitly so it never depends on RENDER_SERVICE_NAME being injected.
      #
      # OLUMI_ENV is deliberately NOT set here. It would change getRuntimeEnv()
      # — which also gates the graph-management live→shadow lockdown and the
      # raw-IO policy — and that is out of scope for this change.
      #
      # PROMPTS_ENVIRONMENT alone makes the prompt pointer deterministic here
      # regardless of whether RENDER_SERVICE_NAME is injected, with ONE
      # exception: PROMPTS_USE_STAGING outranks it. Leave PROMPTS_USE_STAGING
      # unset on this service. (A BLANK PROMPTS_USE_STAGING= is now normalised
      # to "not set" and is safe; an explicit `false` would still force the
      # production pointer here.)
      - key: PROMPTS_ENVIRONMENT
        value: staging
      - key: LLM_PROVIDER
        value: fixtures
      - key: ENABLE_DOCUMENT_GROUNDING
        value: "true"
      - key: ENABLE_CSV_GROUNDING
        value: "true"
      - key: ENABLE_CRITIQUE
        value: "true"
      - key: ENABLE_CLARIFIER
        value: "true"
      - key: ENABLE_EVIDENCE_PACK
        value: "true"
      - key: GLOBAL_RATE_LIMIT_RPM
        value: "120"
      - key: SSE_RATE_LIMIT_RPM
        value: "20"
      - key: BODY_LIMIT_BYTES
        value: "1048576"
      - key: COST_MAX_USD
        value: "1.00"
      - key: ALLOWED_ORIGINS
        value: "https://olumi.app,https://app.olumi.app,http://localhost:5173,http://localhost:5174,http://localhost:3000"
      - key: INFO_SAMPLE_RATE
        value: "1.0"
      - key: PORT
        value: "3101"
