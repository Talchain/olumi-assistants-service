name: Test Skip Guard

# O-6: AST-based skip inventory (scripts/ci/test-skip-inventory.mjs) replaces
# the old grep, which scanned only `tests/` for the literal `.skip(` — blind to
# src/**/__tests__ (~480 files), `it.todo`, `describe.skipIf`/`runIf`, the
# `ready ? describe : describe.skip` ternary (no parens), options-form
# `{ skip: cond }`, and `xit`/`xdescribe` aliases. The scanner self-tests on an
# inline fixture (positive control) before making any claim, and the committed
# inventory (scripts/ci/test-skip-inventory.json) must match the scan EXACTLY:
# new/grown skip constructs fail (add a reviewed entry with a reason), stale or
# shrunken entries fail too (ratchet down), and every entry needs a non-empty
# reason.

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, staging]

# ⛔ SUPERSEDED RUNS MUST NOT HOLD RUNNERS.
#
# Measured 23 Sep 2026, 00:26 UTC: 63 workflow runs queued against 1 in
# progress, with 25 open PRs. Nothing could go green, so nothing could merge,
# so nothing could deploy — the queue, not any individual change, was the
# binding constraint on shipping. Without a concurrency group every push
# enqueues a fresh full set and the runs it superseded keep their place.
#
# ⚠ `cancel-in-progress` is FALSE on staging and main, deliberately. A run on a
# protected branch is the deploy gate and part of the record; cancelling one
# would destroy evidence of what was verified at that SHA. Only branch and PR
# runs — where a newer push has already made the older run irrelevant — cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main' }}

jobs:
  skip-inventory:
    name: Test-skip inventory (AST, ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        # Full install for the `typescript` dependency the AST scanner uses —
        # same pattern (and token) as the other jobs in ci.yml.
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Check test-skip inventory
        run: node scripts/ci/test-skip-inventory.mjs
