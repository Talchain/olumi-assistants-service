name: Graph Evaluator

# WHY THIS WORKFLOW EXISTS
#
# `tools/graph-evaluator` had NO CI EXECUTION AT ALL. Both repo-root runner
# configs exclude `tools/graph-evaluator/**` via STANDALONE_TOOL_EXCLUSIONS
# (vitest.shared.ts), and their own comments say so in as many words:
#
#   "with both root configs excluding it, the tool has NO repo-root CI
#    execution at all until the dedicated graph-evaluator job lands
#    (Phase 2 wiring)"
#
# That exclusion is CORRECT and stays. It is a PACKAGE BOUNDARY, not a red
# carve-out: the tool has its own package.json, its own package-lock.json and
# its own runner, and collecting it from the root configs throws
# ERR_MODULE_NOT_FOUND on its tool-local imports (gray-matter, commander,
# csv-stringify...). The missing half was never the exclusion - it was this
# job. This file is that Phase 2 wiring.
#
# What was failing in the dark: `tests/governed-draft-graph.test.ts` pins the
# exact serving prompt composition, and it currently reports THIRTEEN problems:
# 9 source-hash mismatches, 2 content-hash drifts and 2 governance-artefact
# drifts. The pin exists, the pin is correct, the pin is failing, and nobody
# could see it.
#
# ADVISORY, DELIBERATELY. Branch protection on `staging` requires exactly one
# context - `Lint, TypeCheck, Unit Tests` - so this job cannot block a merge,
# and the two content steps additionally carry `continue-on-error` so their
# standing red does not redden the job. NEVER add a standing-red job as a
# required check (D-58): a red everyone learns to ignore is a broken alarm,
# which is most of how the tool ended up unobserved in the first place.
#
# BUT ADVISORY MUST NOT MEAN SILENT, which is why the last step is NOT
# continue-on-error. It fails the job when:
#   - the run could not happen or was vacuous (zero collected tests, no
#     summary line, a collect shrink against the files on disk); or
#   - the failing set DRIFTS from scripts/ci/graph-evaluator-known-red.json,
#     in either direction.
#
# WHAT THE RATCHET ACTUALLY DETECTS - stated precisely, because an earlier
# version of this comment overclaimed it. The recorded unit is the SET of
# failing test FILES and the failed-TEST COUNT within each file. So it REDs
# on: a newly failing file, a file that stops failing, a changed failed-test
# count inside a file, a drop below the passing-test floor, a collect shrink,
# or a vacuous run - every one of which a blanket `continue-on-error` would
# leave silent.
#
# KNOWN BLIND SPOT: it CANNOT see a change in the number of problems inside a
# single already-failing assertion. All thirteen problems above live in ONE
# `it`, failing on one `expect(result.problems).toEqual([])`. A FOURTEENTH
# drifted hash APPENDS to that array - the failed-test count stays 1, `passed`
# stays at the floor, `Test Files` stays 18. Every signal the guard computes
# is unchanged, so it would exit 0 with the same warning. Closing that needs
# the tool to emit a machine-readable result the guard reads; scraping the
# count out of vitest output is not robust (vitest prints `[ ...(13) ]` only
# past its truncation threshold). Recorded in the `$comment` of
# scripts/ci/graph-evaluator-known-red.json.
#
# As entries are fixed, that file shrinks; when it is empty, delete the two
# `continue-on-error` lines below and promote this job to a required check.

on:
  push:
    branches: [main, staging, feat/**]
  pull_request:
    branches: [main, staging]

# ⛔ SUPERSEDED RUNS MUST NOT HOLD RUNNERS.
#
# Measured 23 Sep 2026, 00:26 UTC: 63 workflow runs queued against 1 in
# progress, with 25 open PRs. Nothing could go green, so nothing could merge,
# so nothing could deploy — the queue, not any individual change, was the
# binding constraint on shipping. Without a concurrency group every push
# enqueues a fresh full set and the runs it superseded keep their place.
#
# ⚠ `cancel-in-progress` is FALSE on staging and main, deliberately. A run on a
# protected branch is the deploy gate and part of the record; cancelling one
# would destroy evidence of what was verified at that SHA. Only branch and PR
# runs — where a newer push has already made the older run irrelevant — cancel.
concurrency:
  # ⛔ NORMALISED REF, so a same-repo PR and its branch push share ONE group.
  #
  # Measured on PR #1711, one head SHA: `Lint, TypeCheck, Unit Tests` ran TWICE.
  # These workflows trigger on both `push` and `pull_request`, and for a branch
  # in this repo those produce different `github.ref` — `refs/heads/<branch>`
  # versus `refs/pull/<n>/merge`. Different ref, different group, both survive.
  # With 25 open PRs that doubling is plausibly the larger half of the queue.
  #
  # ⚠ The obvious remedy, `github.head_ref || github.ref`, does NOT work: on a
  # PR `head_ref` is "fix/foo" while on a push `github.ref` is
  # "refs/heads/fix/foo" — still two groups. `github.ref_name` strips the
  # refs/heads/ prefix, so pairing it with `pull_request.head.ref` yields the
  # same string from both events.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  graph-evaluator:
    name: Graph Evaluator (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # LOAD-BEARING. tools/graph-evaluator/src/governed-draft-graph.ts
          # runs `git merge-base <manifest serving sha> HEAD` and
          # `git show -s --format=%T <sha>` against the repo root. On a shallow
          # checkout both return null and the governed verification silently
          # takes a different path - a wrong answer, not an error. The
          # observability guard cannot see that; the fetch depth is the fix.
          fetch-depth: 0

      # TWO INSTALLS, AND BOTH ARE REQUIRED. The tool is a separate package
      # (npm + its own lockfile), but it is NOT self-contained: it reads
      # repo-root `src/**` and spawns the repo-root `node_modules/.bin/tsx`
      # with `cwd: REPO_ROOT`. MEASURED at 16d36c5c with the tool-local install
      # alone: governed-draft-graph.test.ts reports 15 failed instead of 1,
      # entirely from ENOENT on the root tsx and an unresolvable
      # `@talchain/schemas`. The guard asserts both installs landed before it
      # believes any count.
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 9, matching every other installing job. The 35 dependency
          # overrides live in package.json, which pnpm >=10 IGNORES with only
          # a [WARN] - see scripts/ci/assert-pnpm-overrides-readable.mjs.
          version: 9
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install product dependencies (repo root, pnpm)
        run: pnpm install --frozen-lockfile
        env:
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Install tool dependencies (tools/graph-evaluator, npm - package boundary)
        working-directory: tools/graph-evaluator
        run: npm ci --no-audit --no-fund

      - name: Typecheck the tool (ADVISORY - standing red, see known-red ratchet)
        continue-on-error: true
        working-directory: tools/graph-evaluator
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/graph-evaluator-typecheck.log"

      - name: Run the tool's tests (ADVISORY - standing red, see known-red ratchet)
        continue-on-error: true
        working-directory: tools/graph-evaluator
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/graph-evaluator-tests.log"

      # NOT continue-on-error, ON PURPOSE. This is the whole point of the job:
      # a test step that silently collects nothing exits 0 and looks exactly
      # like a passing one. This step reddens on a vacuous run and on any drift
      # from the recorded known-red set. Run from the repo root (never a
      # ../../ path) so tests/meta/guard-liveness.test.ts can SEE the
      # invocation edge and classify this guard honestly.
      - name: Assert the run was OBSERVED, not vacuous
        if: always()
        run: |
          node scripts/ci/assert-graph-evaluator-observed.mjs \
            --tests-log "$RUNNER_TEMP/graph-evaluator-tests.log" \
            --typecheck-log "$RUNNER_TEMP/graph-evaluator-typecheck.log"
